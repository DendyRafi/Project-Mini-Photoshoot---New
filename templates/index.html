<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Lab</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">
            Pixel Lab
        </span>
    </nav>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 sidebar">

                <h4 class="mt-3">Tools</h4>

                <form action="/upload" method="POST" enctype="multipart/form-data">

                    <input
                        type="file"
                        name="image"
                        class="form-control mb-3"
                    >

                    <button class="btn btn-primary w-100">
                        Upload
                    </button>

                </form>

                {% if filename %}

                <div class="d-grid gap-2">

                    <a href="/grayscale/{{ filename }}" class="btn btn-dark">
                        Grayscale
                    </a>

                    <a href="/blur/{{ filename }}" class="btn btn-dark">
                        Blur
                    </a>

                    <a href="/sharpen/{{ filename }}" class="btn btn-dark">
                        Sharpen
                    </a>

                    <a href="/threshold/{{ filename }}" class="btn btn-dark">
                        Threshold
                    </a>

                    <a href="/edge/{{ filename }}" class="btn btn-dark">
                        Edge
                    </a>

                </div>

                {% endif %}

            </div>

            <!-- Main Content -->
            <div class="col-md-10">

                <div class="row p-4">

                    <!-- Gambar Asli -->
                    <div class="col-md-6 text-center">

                        <h3>Original Image</h3>

                        {% if filename %}

                        <img
                            src="{{ url_for('static', filename='uploads/' + filename) }}"
                            class="img-fluid preview-image"
                        >

                        {% endif %}

                    </div>

                    <!-- Hasil -->
                    <div class="col-md-6 text-center">

                        <h3>Processed Image</h3>

                        {% if output_image %}

                        <img
                            src="{{ url_for('static', filename='outputs/' + output_image) }}"
                            class="img-fluid preview-image"
                        >

                        {% endif %}

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
